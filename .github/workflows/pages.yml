name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# デプロイ途中のキャンセルで公開が中途半端にならないよう、実行中はキャンセルしない
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: 公開用フォルダを作成
        run: mkdir -p site && cp index.html site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: d
        uses: actions/deploy-pages@v4
