<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>副業会計・確定申告管理</title>
<style>
:root{--bg:#0b1220;--bg2:#0e1830;--card:#121e36;--bd:#22324f;--fg:#e8eefc;--mut:#8ea0c0;--ac:#d4af37;--tl:#2dd4bf;--up:#34d399;--dn:#f87171;--wn:#fbbf24}
*{box-sizing:border-box}html,body{overflow-x:hidden;max-width:100%}pre{white-space:pre-wrap;word-break:break-all}
body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#16294d,transparent),var(--bg);color:var(--fg);font:15px/1.65 system-ui,"Hiragino Sans","Meiryo",sans-serif}
.shell{display:flex;min-height:100vh}.ct{flex:1;min-width:0}
nav{width:226px;flex:none;background:var(--bg2);border-right:1px solid var(--bd);padding:14px 10px;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{font-weight:800;letter-spacing:.08em;color:var(--ac);padding:4px 8px 12px;font-size:14px}
nav button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--mut);padding:9px 10px;border-radius:8px;cursor:pointer;font:inherit}
nav button:hover{background:#17274a;color:var(--fg)}
nav button.on{background:linear-gradient(90deg,#1d3260,#14223f);color:var(--ac);font-weight:700;box-shadow:inset 3px 0 var(--ac)}
header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--bd);background:rgba(11,18,32,.85);position:sticky;top:0;z-index:5;backdrop-filter:blur(8px)}
header h1{font-size:17px;margin:0;flex:1}header select{width:auto}
.badge{font-size:12px;color:var(--up);border:1px solid var(--up);border-radius:99px;padding:1px 10px}
main{padding:16px 18px;max-width:1100px}
.card{background:linear-gradient(180deg,var(--card),#0f1a30);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:linear-gradient(135deg,#14264a,#0f1a30);border:1px solid var(--bd);border-radius:12px;padding:12px 14px}
.kpi span{color:var(--mut);font-size:12px}.kpi b{display:block;font:700 21px ui-monospace,Menlo,Consolas,monospace;margin-top:2px;word-break:break-all}
.up{color:var(--up)}.dn{color:var(--dn)}
.help{border-left:4px solid var(--tl);background:rgba(45,212,191,.07);padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:14px}
.warn{border-left:4px solid var(--wn);color:var(--wn);padding:6px 10px;margin:8px 0;background:rgba(251,191,36,.07);border-radius:6px;font-size:14px}
.step{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}.step i{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;border:2px solid var(--ac);color:var(--ac)}.step.ok i{background:var(--up);border-color:var(--up);color:#06281d}.step div{flex:1}
.tw{overflow:hidden}table{border-collapse:collapse;width:100%;font-size:14px}
th{color:var(--mut);font-size:12px;font-weight:600;letter-spacing:.04em}
th,td{border-bottom:1px solid var(--bd);padding:7px 8px;text-align:left;word-break:break-word}td.n,th.n{text-align:right;font-family:ui-monospace,Menlo,Consolas,monospace}
tr:hover td{background:rgba(255,255,255,.03)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label{display:block;font-size:12px;color:var(--mut)}label small{display:block;color:#6f84a8;margin-top:2px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:#0a1324;color:var(--fg);font:inherit;min-width:0}
input:focus,select:focus{outline:2px solid var(--ac);border-color:transparent}
button.b{background:linear-gradient(135deg,#e6c34f,#b8902a);color:#1a1405;border:0;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;margin:6px 6px 0 0}
button.s{background:transparent;color:var(--ac);border:1px solid var(--ac)}
details{border-bottom:1px solid var(--bd);padding:6px 0}summary{cursor:pointer;color:var(--ac)}
#toast{position:fixed;right:16px;bottom:16px;background:var(--up);color:#06281d;padding:10px 16px;border-radius:10px;font-weight:700;z-index:9}
@media(max-width:860px){.shell{display:block}nav{width:auto;height:auto;position:static;display:flex;flex-wrap:wrap;gap:2px;border-right:0;border-bottom:1px solid var(--bd)}.logo{width:100%}nav button{width:auto;padding:7px 9px;font-size:13px}main{padding:12px}}
@media(max-width:720px){table,tbody{display:block}tr.h{display:none}tr{display:block;border:1px solid var(--bd);border-radius:8px;margin-bottom:8px;padding:4px 8px}td{display:flex;justify-content:space-between;gap:8px;border:0;padding:3px 2px;text-align:right!important}td::before{content:attr(data-l);color:var(--mut);text-align:left;flex:none}}
@media print{nav,header,button,.np,.help{display:none}body{background:#fff;color:#000}.card{box-shadow:none;background:#fff;color:#000}}
</style></head><body>
<div class="shell"><nav id="nav"></nav><div class="ct"><header><h1>副業会計・確定申告管理</h1><span id="st" class="badge">起動中</span><label style="display:flex;gap:6px;align-items:center">対象年 <select id="yr" onchange="S.year=+this.value;R()"></select></label></header><main id="app"></main></div></div>
<script>
const TAX=['未選択','事業所得','雑所得','不動産所得','給与所得','配当所得','譲渡所得','一時所得','その他・要確認'];
const CATS=['通信費','消耗品費','旅費交通費','広告宣伝費','支払手数料','外注費','研修費','新聞図書費','水道光熱費','地代家賃','接待交際費','車両関連費','修繕費','保険料','租税公課','減価償却費','その他'];
const S={db:{businesses:[],income:[],expense:[],salary:[],meta:{}},year:new Date().getFullYear(),tab:'dash',edit:null};
const ICON={guide:'🧭',dash:'📈',businesses:'🏢',income:'💰',expense:'🧾',salary:'💼',owner:'🔁',assets:'🖥',invest:'📊',ledger:'📚',report:'📑',accounts:'🗂',opening:'🏦',manual:'✍',import:'📥',data:'💾',notes:'⚠'};
const TABS={guide:'はじめに',dash:'ダッシュボード',businesses:'事業・副業',income:'収入',expense:'支出・経費',salary:'給与',owner:'事業主貸借',assets:'固定資産',invest:'投資取引',ledger:'仕訳・帳簿',report:'申告準備',accounts:'勘定科目',opening:'期首残高',manual:'手動仕訳',import:'CSV取込',data:'データ・テスト',notes:'確認事項'};
const ENT={
businesses:{f:[['name','事業名*','text'],['category','管理用カテゴリ','text'],['tax','税務上の所得区分(要確認)','sel',TAX],['blue','青色申告','sel',['未確認','対象','対象外']],['start','開始日','date'],['end','終了日','date'],['active','状態','sel',['有効','無効']],['note','備考','text']],cols:['name','category','tax','blue','active']},
income:{f:[['date','発生日*','date'],['paid','入金日','date'],['biz','事業*','biz'],['partner','取引先・PF','text'],['desc','内容','text'],['gross','売上(税込)*','num'],['fee','手数料','num'],['wh','源泉徴収税額','num'],['status','入金状況','sel',['入金済','未入金']],['inv','請求書番号','text'],['ref','証憑ファイル名','text'],['note','備考','text']],cols:['date','biz','partner','gross','fee','wh','dep','status']},
expense:{f:[['date','支払日*','date'],['payee','支払先','text'],['desc','内容','text'],['amount','金額*','num'],['biz','事業*','biz'],['cat','経費カテゴリ','sel',CATS],['ratio','事業使用割合%','num'],['basis','按分の根拠','text'],['method','支払方法','text'],['ref','証憑ファイル名','text']],cols:['date','payee','desc','amount','biz','cat','ratio','ded']},
salary:{f:[['payer','支払者*','text'],['year','対象年*','num'],['gross','支払金額*','num'],['wh','源泉徴収税額','num'],['social','社会保険料等','num'],['ye','年末調整','sel',['済','未','不明']],['chk','源泉徴収票の確認','sel',['未確認','確認済']],['note','備考','text']],cols:['payer','year','gross','wh','social','ye','chk']},
owner:{f:[['date','日付*','date'],['kind','区分','sel',['事業主貸','事業主借']],['amount','金額*','num'],['acct','口座','sel',['普通預金','現金']],['note','備考','text']],cols:['date','kind','amount','acct','note']},
assets:{f:[['aname','資産名*','text'],['buy','購入日*','date'],['cost','取得価額*','num'],['start','使用開始日*','date'],['ratio','事業使用割合%','num'],['life','耐用年数*','num'],['sold','売却・廃棄日','date'],['note','備考(償却方法の根拠等)','text']],cols:['aname','buy','cost','ratio','life','adep','abv']},
invest:{f:[['date','売買日*','date'],['acct','口座区分','sel',['特定口座(源泉あり)','特定口座(源泉なし)','一般口座','NISA口座']],['kind','商品','sel',['現物株','信用取引','投資信託','FX','先物','暗号資産','配当・分配金']],['code','銘柄コード・名称','text'],['side','売買','sel',['買','売','配当']],['qty','数量','num'],['price','単価','num'],['fee','手数料','num'],['realized','実現損益(手入力)','num'],['wh','源泉徴収税額','num'],['note','備考(申告要否・繰越等)','text']],cols:['date','acct','kind','code','side','realized','wh']},
accounts:{f:[['acname','勘定科目名*','text'],['actype','種別','sel',['費用','収益','資産','負債']],['note','備考','text']],cols:['acname','actype','note']},
manual:{f:[['date','日付*','date'],['mdr','借方科目','acc'],['mcr','貸方科目','acc'],['amount','金額*','num'],['memo','摘要','text']],cols:['date','mdr','mcr','amount','memo']},
opening:{f:[['year','対象年*','num'],['oacct','科目','acc'],['amount','期首残高*','num']],cols:['year','oacct','amount']}};
const L={note:'備考',acname:'勘定科目名',actype:'種別',mdr:'借方',mcr:'貸方',memo:'摘要',oacct:'科目',aname:'資産名',buy:'購入日',cost:'取得価額',life:'耐用年数',adep:'当年償却費(仮)',abv:'期末簿価(仮)',kind:'区分',acct:'口座',code:'銘柄',side:'売買',realized:'実現損益',name:'事業名',category:'カテゴリ',tax:'所得区分',blue:'青色',active:'状態',date:'日付',biz:'事業',partner:'取引先',gross:'金額',fee:'手数料',wh:'源泉',dep:'入金額',status:'入金',payee:'支払先',desc:'内容',amount:'金額',cat:'科目',ratio:'割合%',ded:'経費算入額',payer:'支払者',year:'年',social:'社保',ye:'年末調整',chk:'確認'};
const NUM=new Set(['cost','adep','abv','realized','qty','gross','fee','wh','dep','amount','ded','social','ratio']);
const yen=n=>(+n||0).toLocaleString('ja-JP');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// ---- 計算（純粋関数）----
const calc={dep:r=>(+r.gross||0)-(+r.fee||0)-(+r.wh||0),
 ded:r=>Math.round((+r.amount||0)*(r.ratio===''||r.ratio==null?100:+r.ratio)/100),
 summary(db,y){const inY=d=>String(d||'').startsWith(y),out={salary:0,biz:{},unpaid:0,cat:{}};
  db.salary.filter(s=>+s.year===y).forEach(s=>out.salary+=+s.gross||0);
  const B=id=>out.biz[id]||(out.biz[id]={sales:0,exp:0});
  db.income.filter(r=>inY(r.date)).forEach(r=>{B(r.biz).sales+=+r.gross||0;if(r.status==='未入金')out.unpaid+=calc.dep(r)});
  db.expense.filter(r=>inY(r.date)).forEach(r=>{const d=calc.ded(r);B(r.biz).exp+=d;out.cat[r.cat]=(out.cat[r.cat]||0)+d});
  return out}};

const ACC=c=>CATS.includes(c)?c:'雑費',sum=a=>a.reduce((x,y)=>x+y[1],0),inY=(d,y)=>String(d||'').startsWith(String(y));
const _d=(b,n,t,sy,sm)=>Math.floor(b/n*(t===sy?(13-sm)/12:1)),base=a=>(+a.cost||0)*(a.ratio===''||a.ratio==null?100:+a.ratio)/100;
calc.assetDep=(a,y)=>{const b=base(a),n=+a.life||0;if(!n||!a.start)return 0;const sy=+a.start.slice(0,4),sm=+a.start.slice(5,7)||1;if(y<sy||(a.sold&&+a.sold.slice(0,4)<y))return 0;let acc=0;for(let t=sy;t<y;t++)acc+=_d(b,n,t,sy,sm);return Math.max(0,Math.min(_d(b,n,y,sy,sm),Math.floor(b)-1-acc))};
calc.assetBV=(a,y)=>{if(!a.start||y<+a.start.slice(0,4))return 0;let v=base(a);for(let t=+a.start.slice(0,4);t<=y;t++)v-=calc.assetDep(a,t);return Math.round(v)};
calc.journals=(db,y)=>{const J=[],p=(date,memo,dr,cr,src,biz)=>J.push({date,memo,dr:dr.filter(x=>x[1]),cr:cr.filter(x=>x[1]),src,biz});
 (db.income||[]).filter(r=>inY(r.date,y)).forEach(r=>{const g=+r.gross||0,f=+r.fee||0,w=+r.wh||0;p(r.date,'売上 '+(r.partner||''),[[r.status==='未入金'?'売掛金':'普通預金',g-f-w],['支払手数料',f],['事業主貸',w]],[['売上',g]],r.id,r.biz)});
 (db.expense||[]).filter(r=>inY(r.date,y)).forEach(r=>{const a=+r.amount||0,d=calc.ded(r),m=r.method||'';p(r.date,(r.payee||'')+' '+(r.desc||''),[[ACC(r.cat),d],['事業主貸',a-d]],[[m.includes('現金')?'現金':m.includes('カード')?'未払金':'普通預金',a]],r.id,r.biz)});
 (db.owner||[]).filter(r=>inY(r.date,y)).forEach(r=>{const a=+r.amount||0,c=r.acct||'普通預金';if(r.kind==='事業主貸')p(r.date,'事業主貸',[['事業主貸',a]],[[c,a]],r.id);else p(r.date,'事業主借',[[c,a]],[['事業主借',a]],r.id)});
 (db.assets||[]).forEach(a=>{const b=Math.round(base(a));if(inY(a.buy,y))p(a.buy,'取得 '+a.aname,[['工具器具備品',b]],[['普通預金',b]],a.id);const d=calc.assetDep(a,y);if(d)p(y+'-12-31','減価償却 '+a.aname,[['減価償却費',d]],[['工具器具備品',d]],a.id)});
 const lia=['未払金','事業主借',...(db.accounts||[]).filter(a=>a.actype==='負債').map(a=>a.acname)];
 (db.opening||[]).filter(r=>+r.year===+y).forEach(r=>{const a=+r.amount||0;lia.includes(r.oacct)?p(y+'-01-01','期首残高 '+r.oacct,[['元入金',a]],[[r.oacct,a]],'op'):p(y+'-01-01','期首残高 '+r.oacct,[[r.oacct,a]],[['元入金',a]],'op')});
 (db.manual||[]).filter(r=>inY(r.date,y)).forEach(r=>p(r.date,'手動: '+(r.memo||''),[[r.mdr,+r.amount||0]],[[r.mcr,+r.amount||0]],r.id));
 return J.sort((x,z)=>x.date<z.date?-1:x.date>z.date?1:0)};
calc.tb=J=>{const t={};J.forEach(j=>{j.dr.forEach(([a,v])=>(t[a]=t[a]||[0,0])[0]+=v);j.cr.forEach(([a,v])=>(t[a]=t[a]||[0,0])[1]+=v)});return t};
calc.invest=(db,y)=>{const o={};(db.invest||[]).filter(r=>inY(r.date,y)).forEach(r=>o[r.acct]=(o[r.acct]||0)+(+r.realized||0));return o};
calc.isDup=(list,r)=>list.some(x=>x.date===r.date&&(x.biz||'')===(r.biz||'')&&(+x.gross||+x.amount)===(+r.gross||+r.amount)&&(x.partner||x.payee||'')===(r.partner||r.payee||''));
const fix=d=>{['businesses','income','expense','salary','owner','assets','invest','accounts','manual','opening'].forEach(k=>d[k]=d[k]||[]);d.meta=d.meta||{};return d};
function dlCsv(n,rows){const c=v=>'"'+String(v??'').replace(/"/g,'""')+'"';dl(n,'\ufeff'+rows.map(r=>r.map(c).join(',')).join('\r\n'),'text/csv')}
const fmt=l=>l.map(x=>x[0]+' '+yen(x[1])).join(' / ');
function jcsv(){dlCsv('journal_'+S.year+'.csv',[['日付','借方','貸方','摘要'],...calc.journals(S.db,S.year).map(j=>[j.date,fmt(j.dr),fmt(j.cr),j.memo])])}
function tbcsv(){const t=calc.tb(calc.journals(S.db,S.year));dlCsv('trial_balance_'+S.year+'.csv',[['科目','借方','貸方'],...Object.entries(t).map(([a,v])=>[a,v[0],v[1]])])}
function ledger(){const J=calc.journals(S.db,S.year),bad=J.filter(j=>sum(j.dr)!==sum(j.cr)),t=calc.tb(J),ac=S.acct||'普通預金';let run=0;const L2=[];
 J.forEach(j=>{const d=sum(j.dr.filter(x=>x[0]===ac)),c=sum(j.cr.filter(x=>x[0]===ac));if(d||c){run+=d-c;L2.push([j.date,j.memo,d,c,run])}});
 const names=[...new Set(['現金','普通預金','売掛金','未払金',...Object.keys(t)])];
 return `<div class="card"><b>仕訳帳(${S.year}年・入力データから自動生成)</b>${bad.length?`<div class="warn">貸借不一致の仕訳が${bad.length}件あります</div>`:`<br><small>貸借一致を自動検証済み(${J.length}件)</small>`}
 <div class="tw"><table><tr><th>日付</th><th>借方</th><th>貸方</th><th>摘要</th></tr>${J.map(j=>`<tr><td>${esc(j.date)}</td><td>${esc(fmt(j.dr))}</td><td>${esc(fmt(j.cr))}</td><td>${esc(j.memo)}</td></tr>`).join('')||'<tr><td colspan=4>仕訳がありません。収入・経費などを登録すると自動生成されます。</td></tr>'}</table></div><button class="b" onclick="jcsv()">仕訳帳CSV</button></div>
 <div class="card"><b>試算表</b><div class="tw"><table><tr><th class="n">科目</th><th class="n">借方</th><th class="n">貸方</th><th class="n">残高(借−貸)</th></tr>${Object.entries(t).map(([a,v])=>`<tr><td>${esc(a)}</td><td class="n">${yen(v[0])}</td><td class="n">${yen(v[1])}</td><td class="n">${yen(v[0]-v[1])}</td></tr>`).join('')||'<tr><td colspan=4>データなし</td></tr>'}</table></div><button class="b" onclick="tbcsv()">試算表CSV</button></div>
 <div class="card"><b>総勘定元帳・出納帳</b><label>科目(現金=現金出納帳、普通預金=預金出納帳、売掛金・未払金=残高管理)<select onchange="S.acct=this.value;R()">${names.map(n=>`<option ${n===ac?'selected':''}>${esc(n)}</option>`).join('')}</select></label>

function parseCSV(t){const R=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=h}else if(h=='"')q=true;else if(h==','){r.push(c);c=''}else if(h=='\n'||h=='\r'){if(h=='\r'&&t[i+1]=='\n')i++;r.push(c);R.push(r);r=[];c=''}else c+=h}if(c||r.length){r.push(c);R.push(r)}return R.filter(x=>x.some(v=>v!==''))}

const load=async()=>{idb=await open();return new Promise(r=>{const q=idb.transaction('kv').objectStore('kv').get('db');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})};
const save=()=>new Promise((res,rej)=>{S.db.meta.saved=new Date().toISOString();const t=idb.transaction('kv','readwrite');t.objectStore('kv').put(S.db,'db');t.oncomplete=()=>{const e=document.getElementById('st');if(e)e.textContent='✔ 保存済 '+new Date().toLocaleTimeString('ja-JP');res()};t.onerror=()=>rej(t.error)});

 return `<svg viewBox="0 0 340 140" width="100%" role="img" aria-label="月別売上と経費"><line x1="4" x2="336" y1="115" y2="115" stroke="#22324f"/>${m.map((v,i)=>{const x=8+i*27,a=v[0]/mx*100,b=v[1]/mx*100;return `<rect x="${x}" y="${115-a}" width="10" height="${a}" fill="#34d399" rx="2"/><rect x="${x+11}" y="${115-b}" width="10" height="${b}" fill="#f87171" rx="2"/><text x="${x+10}" y="130" font-size="9" fill="#8ea0c0" text-anchor="middle">${i+1}月</text>`}).join('')}</svg>`}

function crud(k){const E=ENT[k],e=S.edit,rows=S.db[k].filter(r=>k==='businesses'||k==='assets'||k==='accounts'||(k==='salary'||k==='opening'?+r.year===S.year:String(r.date).startsWith(S.year)));

 const inp=f=>{const h=HINT[f[0]],x=inp0(f);return h?x.replace('</label>',`<small>${h}</small></label>`):x},inp0=([n,l,t,o])=>{const v=sample[n]??(n==='ratio'?100:'');

 const warn=k==='invest'?'<div class="warn">投資損益は事業売上とは別管理です。NISA口座は課税口座と合算しません。実現損益は取引報告書等を見て手入力してください(自動計算は未対応)。</div>':k==='assets'?'<div class="warn">減価償却は簡易的な定額法の仮計算です。少額減価償却資産の特例・耐用年数・償却方法は必ず確認してください。</div>':k==='owner'?'<div class="warn">家計と事業の間の資金移動です。収入・経費には含まれません。</div>':k==='expense'?'<div class="warn">按分割合を設定しても、必要経費として認められるとは限りません。根拠を記録してください。</div>':k==='income'?'<div class="warn">売上・手数料・源泉徴収税額・入金額は別項目です。入金額＝売上−手数料−源泉(手数料が売上から差し引かれる場合の目安)。</div>':'';
 return `<div class="card"><b>${TABS[k]}${e?'を編集':'を追加'}</b>${warn}<div class="g">${E.f.map(inp).join('')}</div><button class="b" onclick="saveRow('${k}')">保存</button>${e?'<button class="b s" onclick="S.edit=null;R()">キャンセル</button>':''}</div>
 <div class="card"><b>一覧${k!=='businesses'?'('+S.year+'年)':''}</b><div class="tw"><table><tr>${E.cols.map(c=>`<th class="${NUM.has(c)?'n':''}">${L[c]}</th>`).join('')}<th></th></tr>${rows.map(r=>`<tr>${E.cols.map(c=>`<td class="${NUM.has(c)?'n':''}">${NUM.has(c)?yen(val(k,r,c)):esc(val(k,r,c))}</td>`).join('')}<td><button class="b s" onclick="S.edit='${r.id}';R()">編集</button><button class="b s" onclick="del('${k}','${r.id}')">削除</button></td></tr>`).join('')||`<tr><td colspan=9>まだ登録がありません。上のフォームから追加してください。</td></tr>`}</table></div></div>`}
async function saveRow(k){const E=ENT[k],o={};
 for(const [n,l,t] of E.f){const v=document.getElementById('f_'+n).value;o[n]=v;if(l.endsWith('*')&&!v)return alert(l.replace('*','')+'は必須です。')}
 if(k==='income'){const d=S.db.income.find(r=>r.id!==S.edit&&r.date===o.date&&r.biz===o.biz&&+r.gross===+o.gross&&r.partner===o.partner);if(d&&!confirm('同じ日付・事業・取引先・金額の収入が既にあります(重複の可能性)。それでも保存しますか？'))return}
 if(S.edit){const i=S.db[k].findIndex(r=>r.id===S.edit);S.db[k][i]={...S.db[k][i],...o}}else S.db[k].push({id:crypto.randomUUID(),...o});

 for(const k of['businesses','income','expense','salary'])if(!Array.isArray(j.data[k]))throw Error(k+'のデータが不正です。');return j.data}
function restore(f){if(!f)return;const r=new FileReader();r.onload=async()=>{try{const d=validate(JSON.parse(r.result));
