const calc={dep:r=>(+r.gross||0)-(+r.fee||0)-(+r.wh||0),
 ded:r=>Math.round((+r.amount||0)*(r.ratio===''||r.ratio==null?100:+r.ratio)/100),
 summary(db,y){const inY=d=>String(d||'').startsWith(y),out={salary:0,biz:{},unpaid:0,nopaid:0,cat:{}};
  db.salary.filter(s=>+s.year===y).forEach(s=>out.salary+=+s.gross||0);

  db.expense.filter(r=>inY(r.date)).forEach(r=>{const d=calc.ded(r);B(r.biz).exp+=d;out.cat[r.cat]=(out.cat[r.cat]||0)+d});
  return out}};

 (db.assets||[]).forEach(a=>{const b=Math.round(base(a));if(inY(a.buy,y))p(a.buy,'取得 '+a.aname,[['工具器具備品',b]],[['普通預金',b]],a.id);const d=calc.assetDep(a,y);if(d)p(y+'-12-31','減価償却(仮) '+a.aname,[['減価償却費',d]],[['工具器具備品',d]],a.id)});

function migrate(j){const d=j.data,v=j.version||1;if(!d||typeof d!=='object')throw Error('data がありません。');if(v>VER)throw Error('新しい形式(version '+v+')のバックアップです。アプリを更新してください。');TBL.forEach(k=>d[k]=d[k]||[]);d.meta=d.meta||{};return d}

 TBL.forEach(k=>d[k].forEach((r,i)=>{const w=k+'['+(i+1)+']: ';if(!r||typeof r!=='object')throw Error(w+'不正なデータです。');if(typeof r.id!=='string'||!r.id)throw Error(w+'id がありません。');if(ids.has(r.id))throw Error(w+'id が重複しています: '+r.id);ids.add(r.id);
